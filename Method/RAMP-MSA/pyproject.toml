[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ramp-msa"
version = "0.1.0"
description = "Regret-Aware Multimodal Procedural Memory for multimodal sentiment analysis"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["ramp_msa*"]
